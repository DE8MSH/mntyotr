MEMORY {
    ZP:      start = $0000, size = $0100, type = rw, define = yes;
    WRAM:    start = $0200, size = $1E00, type = rw, define = yes;

    # One 32 KiB LoROM bank. File areas are emitted consecutively, so the
    # resulting .sfc has no copier header and is exactly 32768 bytes.
    ROM0:    start = $8000, size = $7FC0, type = ro, file = %O, fill = yes, fillval = $FF;
    HEADER:  start = $FFC0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
    VECTORS: start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = WRAM,    type = bss, define = yes;
    CODE:     load = ROM0,    type = ro, start = $8000;
    RODATA:   load = ROM0,    type = ro;
    HEADER:   load = HEADER,  type = ro;
    VECTORS:  load = VECTORS, type = ro;
}
