name: Build HuCard ROM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential git cmake make python3

      - name: Build current HuC/PCEAS toolchain
        run: |
          git clone --depth 1 https://github.com/pce-devel/huc.git "$HOME/huc"
          # Upstream src/all currently exits non-zero after producing pceas.
          # Run it outside the step's implicit `bash -e`, then gate on the
          # executable that this pure-ASM port actually needs.
          set +e
          make -C "$HOME/huc/src" -j"$(nproc)"
          MAKE_RC=$?
          set -e
          echo "HuC src make exit: $MAKE_RC"
          if [ ! -x "$HOME/huc/bin/pceas" ]; then
            echo "ERROR: pceas was not produced" >&2
            exit 1
          fi
          echo "$HOME/huc/bin" >> "$GITHUB_PATH"

      - name: Build MOTR HuCard
        run: |
          export HUC_HOME="$HOME/huc"
          export PATH="$HUC_HOME/bin:$PATH"
          ./build.sh
          cp build/monty.pce build/motr.pce
          sha256sum build/motr.pce

      - name: Upload ROM and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: motr-pce
          path: |
            build/motr.pce
            build/*.sym
            build/*.lst
          if-no-files-found: error
