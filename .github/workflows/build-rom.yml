name: Build HuCard ROM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential git cmake make python3

      - name: Build current HuC/PCEAS toolchain
        run: |
          git clone --depth 1 https://github.com/pce-devel/huc.git "$HOME/huc"
          # Upstream src/all can return non-zero from an unrelated parallel
          # sub-target even after pceas itself was successfully linked/copied.
          # The executable is the actual prerequisite for this pure-ASM port.
          make -C "$HOME/huc/src" -j"$(nproc)" || true
          test -x "$HOME/huc/bin/pceas"
          "$HOME/huc/bin/pceas" -? >/dev/null 2>&1 || true
          echo "$HOME/huc/bin" >> "$GITHUB_PATH"

      - name: Build MOTR HuCard
        run: |
          export HUC_HOME="$HOME/huc"
          export PATH="$HUC_HOME/bin:$PATH"
          ./build.sh
          cp build/monty.pce build/motr.pce
          sha256sum build/motr.pce

      - name: Upload ROM and symbols
        uses: actions/upload-artifact@v4
        with:
          name: motr-pce
          path: |
            build/motr.pce
            build/monty.sym
            build/monty.lst
          if-no-files-found: error
