name: Headless playthrough audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Whole-game source parity audit
        run: make audit

      - name: Install HuC toolchain
        run: ./install.sh

      - name: Generate assets and assemble ROM
        run: ./build.sh

      - name: Upload audit and ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playthrough-audit-${{ github.sha }}
          path: |
            build/playthrough-audit.txt
            build/playthrough-audit.json
            build/monty.pce
            build/monty.sym
            build/monty.lst
          if-no-files-found: warn
